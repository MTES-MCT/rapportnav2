################
################
# Spring
spring.mvc.static-path-pattern=/**
spring.web.resources.static-locations=file:${STATIC_FILES_PATH}
# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true
spring.datasource.url=${ENV_DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Rest API
spring.data.rest.base-path=/api
# RFC 7807 Problem Details for Spring's built-in exception handlers
spring.mvc.problemdetails.enabled=true
# Config override (like serialization)
spring.main.allow-bean-definition-overriding=true
# database migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:/db/migration,classpath:/db/testdata
spring.flyway.out-of-order=true
################
################
# Server
server.port=0080
server.servlet.request.logging.enabled=true
server.servlet.request.logging.level=INFO
server.error.include-stacktrace=always
# gzip compression
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml,image/svg+xml
# Forwarded Headers - enables processing of X-Forwarded-* headers from reverse proxy
# This makes request.remoteAddr return the real client IP and request.isSecure() reflect the original protocol
server.forward-headers-strategy=framework
# Session cookie hardening (ProConnect BFF session). SameSite=Lax mitigates CSRF on the
# session cookie; the OIDC redirect returns via top-level navigation so Lax is sufficient.
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true
################
################
# CORS - default for tests, override in profile-specific properties (infra/configurations/backend/)
cors.allowed-origins=http://localhost:3000,http://localhost:5173
################
################
# Logging
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=ERROR
logging.level.org.springframework.security.web.FilterChainProxy=ERROR
logging.level.org.hibernate.orm.connections.pooling=WARN
################
################
# Sentry
#sentry.enabled=true
#sentry.use-git-commit-id-as-release=true
#AEM Export
rapportnav.aem.template.path=/template_export_aem_PAM.xlsx
rapportnav.aem.tmp_xlsx.path=tmp_AEM_PAM.xlsx
rapportnav.aem.tmp_ods.path=tmp_AEM_PAM.ods
#AEM Export
rapportnav.rapport-patrouille.template.path=/template_export_rapport_patrouille_PAM.docx
rapportnav.rapport-patrouille.tmp_docx.path=tmp_rapport_patrouille_PAM.docx
rapportnav.rapport-patrouille.tmp_odt.path=tmp_rapport_patrouille_PAM.odt

# springdoc
springdoc.api-docs.enabled=false
#springdoc.swagger-ui.path=/swagger-ui.html

# Sentry
sentry.enabled=${SENTRY_ENABLED:false}
sentry.dsn=${SENTRY_DSN:}
sentry.environment=${ENV_PROFILE:prod}
sentry.proxy.host=${PROXY_HOST:}
sentry.proxy.port=${PROXY_PORT:}
# Performance monitoring sample rate (1.0 = 100%, use lower in production for cost)
sentry.traces-sample-rate=0.1
# Attach stack traces to pure log messages
sentry.attach-stacktrace=true
# Include request data in error reports
sentry.send-default-pii=false
# Maximum breadcrumbs to keep
sentry.max-breadcrumbs=50

# Metabase
metabase.site-url=${METABASE_SITE_URL:https://metabase.din.developpement-durable.gouv.fr}
metabase.secret-key=${METABASE_SECRET_KEY:}

#Sati
sati.enabled-services=${SATI_ENABLED_SERVICES:0}

# ProConnect (OIDC) — disabled by default; enable per environment for phased rollout.
# PROCONNECT_DOMAIN: integration=fca.integ01.dev-agentconnect.fr, production=auth.agentconnect.gouv.fr
# Discovery: https://PROCONNECT_DOMAIN/api/v2/.well-known/openid-configuration
# Register redirect-uri = {PUBLIC_URL}/login/oauth2/code/proconnect with ProConnect.
rapportnav.oidc.enabled=${OIDC_ENABLED:true}
rapportnav.oidc.client-id=${OIDC_CLIENT_ID:02d232226cc98d11b5236b0a535fa9f9107634d7a58560cc7f56a93319c34b37}
rapportnav.oidc.client-secret=${OIDC_CLIENT_SECRET:37f4630a37420e34340615c97d5376a5fdbb03faf9a4048eae77a1faa9bf8c2c}
rapportnav.oidc.redirect-uri=${OIDC_REDIRECT_URI:http://localhost:5173/login/oauth2/code/proconnect}
rapportnav.oidc.issuer-uri=${OIDC_ISSUER_URI:https://fca.integ01.dev-agentconnect.fr/api/v2}
rapportnav.oidc.authorization-uri=${OIDC_AUTHORIZATION_URI:https://fca.integ01.dev-agentconnect.fr/api/v2/authorize}
rapportnav.oidc.token-uri=${OIDC_TOKEN_URI:https://fca.integ01.dev-agentconnect.fr/api/v2/token}
rapportnav.oidc.user-info-uri=${OIDC_USERINFO_URI:https://fca.integ01.dev-agentconnect.fr/api/v2/userinfo}
rapportnav.oidc.jwk-set-uri=${OIDC_JWK_SET_URI:https://fca.integ01.dev-agentconnect.fr/api/v2/jwks}
rapportnav.oidc.end-session-uri=${OIDC_END_SESSION_URI:https://fca.integ01.dev-agentconnect.fr/api/v2/session/end}
rapportnav.oidc.success-url=${OIDC_SUCCESS_URL:http://localhost:5173/}
rapportnav.oidc.error-url=${OIDC_ERROR_URL:http://localhost:5173/login?error}
rapportnav.oidc.post-logout-redirect-uri=${OIDC_POST_LOGOUT_REDIRECT_URI:http://localhost:5173/login}
# Force ProConnect two-factor authentication (2FA). When true, the authorization request marks
# `acr` as an essential claim and the returned acr is verified against the MFA eidas set.
# Disabled by default; enable per environment (integration first, then prod) for phased rollout.
rapportnav.oidc.force-mfa=${OIDC_FORCE_MFA:true}
