construction_image:
  rules:
    - if: '$ENV_DEPLOIEMENT == "ecole" || $ENV_DEPLOIEMENT == "integration"'
      when: always
  stage: build
  image:
    # The slim variant has no shell, which GitLab needs to run the script.
    name: martizih/kaniko:v1.29.0-debug
    entrypoint: [""]
  variables:
    GIT_STRATEGY: fetch
    GIT_CLEAN_FLAGS: none
    # Dependency Proxy of dam/applications, shared by all its applications.
    KANIKO_REGISTRY_MIRROR: "$CI_DEPENDENCY_PROXY_SERVER/dam/applications/dependency_proxy/containers"
  script:
    - echo "$CI_REGISTRY_PASSWORD" | /kaniko/executor login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - echo "$CI_DEPENDENCY_PROXY_PASSWORD" | /kaniko/executor login "$CI_DEPENDENCY_PROXY_SERVER" -u "$CI_DEPENDENCY_PROXY_USER" --password-stdin
    - /kaniko/executor --cleanup
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/infra/docker/app/Dockerfile"
      --destination "$CI_REGISTRY_IMAGE/$PROJECT_NAME:$PROJECT_VERSION"
      --label org.opencontainers.image.revision=$CI_COMMIT_SHA
      --build-arg VERSION=$PROJECT_VERSION
      --build-arg ENV_PROFILE="prod"
      --build-arg GITHUB_SHA=$CI_COMMIT_SHA

  needs:
    - job: build_projet_gradle
      artifacts: true
    - job: build_projet_npm
      artifacts: true
